name: Update NFL season data

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Determine current NFL season
        id: season
        run: |
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" -le 2 ]; then
            SEASON=$((YEAR - 1))
          else
            SEASON=$YEAR
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

      - name: Rebuild current season and update data.json
        env:
          SEASON: ${{ steps.season.outputs.season }}
        run: |
          python <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          import numpy as np
          import pandas as pd

          YEAR = int(os.environ["SEASON"])

          W = json.loads(r'''{"midpoints": [29.9995, 90.0, 150.0, 210.0, 270.0, 330.0, 390.0, 450.0, 510.0, 570.0, 630.0, 690.0, 750.0, 810.0, 870.0, 930.0, 990.0, 1050.0, 1110.0, 1170.0, 1230.0, 1290.0, 1350.0, 1410.0, 1470.0, 1530.0, 1590.0, 1650.0, 1710.0, 1770.0, 1830.0, 1890.0, 1950.0, 2010.0, 2070.0, 2130.0, 2190.0, 2250.0, 2310.0, 2370.0, 2430.0, 2490.0, 2550.0, 2610.0, 2670.0, 2730.0, 2790.0, 2850.0, 2910.0, 2970.0, 3030.0, 3090.0, 3150.0, 3210.0, 3270.0, 3330.0, 3390.0, 3450.0, 3510.0, 3570.0], "weight_curve": [0.0, 0.0913644789763823, 0.1389647321502662, 0.14230829975557202, 0.2240405906422563, 0.25598329532071823, 0.28474168624396873, 0.2879373861805111, 0.32449832380125027, 0.3566090124946863, 0.372918332371865, 0.384522991518541, 0.39928042881717885, 0.4183059573581745, 0.42574165611242426, 0.45469662159201646, 0.4508949598810931, 0.4660106104742923, 0.4755861693644839, 0.47368170191569386, 0.516778697337931, 0.5087328020688628, 0.5525783378445307, 0.5302285612333729, 0.5507198532772509, 0.5591492242629302, 0.5970372861174904, 0.623479493763435, 0.6475507350820685, 0.6682858207436501, 0.6909824452671709, 0.6590534687672629, 0.6862825141810119, 0.7181000617110596, 0.7080506129939522, 0.721954621235993, 0.7322911598456805, 0.758881321318553, 0.7575179602291656, 0.7738342253369436, 0.7742987370642067, 0.781736688187007, 0.8057863225632148, 0.8097298743804916, 0.8157169499422382, 0.839894033806015, 0.8441461774645508, 0.8482924799897709, 0.8570708117003318, 0.885934026222837, 0.8834246858593905, 0.8846350064411509, 0.9163058814655264, 0.9411610935425426, 0.9517013206858203, 0.9727535298039581, 0.9636428371781984, 0.9761797172380904, 0.9749799614746073, 1.0], "ot_weight": 0.44648085168267615}''')
          MIDPOINTS = np.array(W["midpoints"])
          WEIGHT_CURVE = np.array(W["weight_curve"])
          OT_WEIGHT = W["ot_weight"]

          def weighted_split(g):
              g = g.dropna(subset=["home_wp", "game_seconds_remaining"]).copy()
              reg_part = g[g.qtr <= 4].sort_values("game_seconds_remaining", ascending=False)
              reg_part["t"] = 3600 - reg_part["game_seconds_remaining"]
              ot_part = g[g.qtr >= 5].sort_values("game_seconds_remaining", ascending=False)
              x_list, y_list, w_list = [], [], []
              if len(reg_part):
                  x_list.append(reg_part["t"].values)
                  y_list.append(reg_part["home_wp"].values)
                  w_list.append(np.interp(reg_part["t"].values, MIDPOINTS, WEIGHT_CURVE))
              if len(ot_part):
                  ot_part = ot_part.copy()
                  ot_part["t"] = 3600 + (ot_part["quarter_seconds_remaining"].max() - ot_part["quarter_seconds_remaining"])
                  x_list.append(ot_part["t"].values)
                  y_list.append(ot_part["home_wp"].values)
                  w_list.append(np.full(len(ot_part), OT_WEIGHT))
              x = np.concatenate(x_list); y = np.concatenate(y_list); w = np.concatenate(w_list)
              order = np.argsort(x); x, y, w = x[order], y[order], w[order]
              return np.trapezoid(w * y, x) / np.trapezoid(w, x)

          def apply_failsafe(home_pts, away_pts, margin):
              if margin > 0 and home_pts < 50.1:
                  return 50.1, 49.9
              if margin < 0 and away_pts < 50.1:
                  return 49.9, 50.1
              return home_pts, away_pts

          url = f"https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{YEAR}.parquet"
          local = f"_pbp_{YEAR}.parquet"
          try:
              urllib.request.urlretrieve(url, local)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"No play-by-play file for {YEAR} yet (404) -- nothing to update.")
                  raise SystemExit(0)
              raise
          d = pd.read_parquet(local, columns=[
              "game_id", "qtr", "game_seconds_remaining", "quarter_seconds_remaining",
              "home_wp", "result", "home_team", "away_team", "week", "season_type",
          ])
          os.remove(local)

          season = d[(d.season_type == "REG") & (d["game_id"].str.startswith(str(YEAR)))]
          rows = []
          for gid in season["game_id"].unique():
              g = season[season.game_id == gid]
              final = g.dropna(subset=["result"])
              if len(final) == 0:
                  continue
              home, away = g["home_team"].iloc[0], g["away_team"].iloc[0]
              wk = int(g["week"].iloc[0])
              home_share = weighted_split(g)
              home_pts, away_pts = round(home_share * 100, 1), round((1 - home_share) * 100, 1)
              margin = final["result"].iloc[-1]
              h, a = apply_failsafe(home_pts, away_pts, margin)
              rows.append({"week": wk, "home": home, "away": away, "home_pts": h, "away_pts": a})

          if not rows:
              print(f"No completed games for {YEAR} yet -- nothing to update.")
              raise SystemExit(0)

          allg = pd.DataFrame(rows)
          long = pd.concat([
              allg[["week", "home", "away", "home_pts"]].rename(columns={"home": "team", "away": "opponent", "home_pts": "UPS"}),
              allg[["week", "away", "home", "away_pts"]].rename(columns={"away": "team", "home": "opponent", "away_pts": "UPS"}),
          ]).reset_index(drop=True)
          long = long.sort_values(["team", "week"]).reset_index(drop=True)

          teams = sorted(long["team"].unique())
          max_week = int(long["week"].max())
          weeks = list(range(1, max_week + 1))
          data = {t: {"ups_score": [], "ups_rank": [], "apsplus_score": [], "apsplus_rank": []} for t in teams}

          for wk in weeks:
              upto = long[long["week"] <= wk].copy()
              ups_avg = upto.groupby("team")["UPS"].mean()
              opp_avg_map = ups_avg.to_dict()
              upto["opp_avg"] = upto["opponent"].map(opp_avg_map)
              upto["contribution"] = (upto["UPS"] / 100) * upto["opp_avg"]
              aps_avg = upto.groupby("team")["contribution"].mean()
              ups_full = ups_avg.reindex(teams)
              aps_full = aps_avg.reindex(teams)
              league_avg_aps = aps_full.mean()
              apsplus_full = aps_full / league_avg_aps * 100
              ups_rank = ups_full.rank(ascending=False, method="min")
              apsplus_rank = apsplus_full.rank(ascending=False, method="min")
              for t in teams:
                  data[t]["ups_score"].append(round(ups_full[t], 1) if pd.notna(ups_full[t]) else None)
                  data[t]["apsplus_score"].append(round(apsplus_full[t], 1) if pd.notna(apsplus_full[t]) else None)
                  data[t]["ups_rank"].append(int(ups_rank[t]) if pd.notna(ups_rank[t]) else None)
                  data[t]["apsplus_rank"].append(int(apsplus_rank[t]) if pd.notna(apsplus_rank[t]) else None)

          season_json = {"season": YEAR, "teams": teams, "weeks": weeks, "data": data}

          with open("data.json", encoding="utf-8") as f:
              all_seasons = json.load(f)
          all_seasons[str(YEAR)] = season_json
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(all_seasons, f)

          print(f"Updated {YEAR} in data.json ({len(weeks)} weeks, {len(teams)} teams).")

          # ===================================================================
          # Projections: division-winner odds and conference-championship-game odds
          # Season simulation (3,000 runs) built on results-only team strengths:
          #   strength = regularized opponent-adjusted UPS this season + last season's UPS,
          #   blended with coefficients fit on 2000-2025 (by weeks remaining).
          # Wrapped in try/except so a failure here never blocks the data.json update.
          # ===================================================================
          try:
              import datetime
              import io

              DIVISIONS = {
                  "AFC East": ["BUF", "MIA", "NE", "NYJ"],
                  "AFC North": ["BAL", "CIN", "CLE", "PIT"],
                  "AFC South": ["HOU", "IND", "JAX", "TEN"],
                  "AFC West": ["DEN", "KC", "LV", "LAC"],
                  "NFC East": ["DAL", "NYG", "PHI", "WAS"],
                  "NFC North": ["CHI", "DET", "GB", "MIN"],
                  "NFC South": ["ATL", "CAR", "NO", "TB"],
                  "NFC West": ["ARI", "LA", "SF", "SEA"],
              }
              RIDGE_LAMBDA = 15.0


              def sig(x):
                  return 1.0 / (1.0 + np.exp(-x))


              def adjust_long(long, hfa):
                  """long: columns week, team, opp, ups, home(1/0). Returns Series of home-field-adjusted UPS."""
                  return long["ups"] - np.where(long["home"] == 1, hfa, -hfa)


              def ridge_strengths(long, hfa, lam=RIDGE_LAMBDA):
                  """Simultaneous opponent-adjusted team strengths (UPS points vs. average)."""
                  adj = adjust_long(long, hfa).values - 50.0
                  teams = sorted(set(long["team"]) | set(long["opp"]))
                  ix = {t: i for i, t in enumerate(teams)}
                  X = np.zeros((len(long), len(teams)))
                  for r, (t, o) in enumerate(zip(long["team"], long["opp"])):
                      X[r, ix[t]] = 1.0
                      X[r, ix[o]] = -1.0
                  s = np.linalg.solve(X.T @ X + lam * np.eye(len(teams)), X.T @ adj)
                  return pd.Series(s, index=teams)


              def predict_ratings(long, prior, coefs, hfa):
                  """Rating = predicted UPS in remaining games minus 50. coefs = [intercept, c_ridge, c_prior]."""
                  s = ridge_strengths(long, hfa)
                  out = {}
                  for t in DIVISIONS_TEAMS:
                      sr = float(s.get(t, 0.0))
                      pr = float(prior.get(t, 50.0))
                      out[t] = coefs[0] + coefs[1] * sr + coefs[2] * pr - 50.0
                  return out


              DIVISIONS_TEAMS = [t for v in DIVISIONS.values() for t in v]


              def simulate(r, wins0, remaining, n_wc, b, hfa, n_sims=3000, seed=1):
                  """r: {team: rating}; wins0: {team: wins so far}; remaining: list of (home, away).
                  Returns (p_division {team: prob}, p_finalist {team: prob of reaching conference title game})."""
                  rng = np.random.default_rng(seed)
                  teams = DIVISIONS_TEAMS
                  ix = {t: i for i, t in enumerate(teams)}
                  rv = np.array([r[t] for t in teams])
                  w0 = np.array([wins0.get(t, 0.0) for t in teams])
                  wins = np.tile(w0, (n_sims, 1))
                  if remaining:
                      hh = np.array([ix[h] for h, a in remaining])
                      aa = np.array([ix[a] for h, a in remaining])
                      ph = sig(b * (rv[hh] - rv[aa] + hfa))
                      out = rng.random((n_sims, len(remaining))) < ph
                      for j in range(len(remaining)):
                          wins[:, hh[j]] += out[:, j]
                          wins[:, aa[j]] += ~out[:, j]
                  wins = wins + rng.random(wins.shape) * 0.01  # random tiebreak
                  div_idx = {d: [ix[t] for t in ts] for d, ts in DIVISIONS.items()}
                  conf_div = {c: [d for d in DIVISIONS if d.startswith(c)] for c in ("AFC", "NFC")}
                  conf_teams = {c: [ix[t] for d in conf_div[c] for t in DIVISIONS[d]] for c in ("AFC", "NFC")}
                  p_div = np.zeros(len(teams))
                  p_fin = np.zeros(len(teams))

                  def play(h, a):
                      return h if rng.random() < sig(b * (rv[h] - rv[a] + hfa)) else a

                  for i in range(n_sims):
                      w = wins[i]
                      for c in ("AFC", "NFC"):
                          winners = []
                          for d in conf_div[c]:
                              m = div_idx[d]
                              wv = m[int(np.argmax(w[m]))]
                              winners.append(wv)
                              p_div[wv] += 1
                          winners.sort(key=lambda q: -w[q])
                          rest = sorted([q for q in conf_teams[c] if q not in winners], key=lambda q: -w[q])[:n_wc]
                          seeds = winners + rest
                          if len(seeds) == 6:
                              alive = [seeds[0], seeds[1], play(seeds[2], seeds[5]), play(seeds[3], seeds[4])]
                          else:
                              alive = [seeds[0], play(seeds[1], seeds[6]), play(seeds[2], seeds[5]), play(seeds[3], seeds[4])]
                          order = sorted(alive, key=lambda q: seeds.index(q))
                          for q in (play(order[0], order[3]), play(order[1], order[2])):
                              p_fin[q] += 1
                  p_div /= n_sims
                  p_fin /= n_sims
                  return ({t: float(p_div[ix[t]]) for t in teams}, {t: float(p_fin[ix[t]]) for t in teams})

              PROJ_COEFS = {"1": [38.3966, 0.8855, 0.2315], "2": [45.838, 0.9753, 0.0841], "3": [44.19, 0.9655, 0.1168], "4": [43.5048, 0.9798, 0.1299], "5": [44.2794, 1.0541, 0.1144], "6": [45.3847, 1.0836, 0.093], "7": [45.2296, 1.0914, 0.0961], "8": [44.8564, 0.9953, 0.1035], "9": [43.8282, 0.9234, 0.124], "10": [43.457, 0.9658, 0.1311], "11": [41.9221, 0.9694, 0.1618], "12": [40.4561, 0.9186, 0.1907], "13": [38.9474, 0.8965, 0.2207], "14": [37.3725, 0.8484, 0.2525], "15": [34.5854, 0.753, 0.3083], "16": [32.6354, 0.767, 0.3482], "17": [31.7118, 0.3637, 0.3659]}
              PROJ_B = np.float64(0.0626)
              PROJ_HFA = np.float64(5.4)
              N_SIMS = 3000

              sched_url = "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
              sch = pd.read_csv(io.StringIO(urllib.request.urlopen(sched_url, timeout=60).read().decode("utf-8")))
              sch = sch[(sch.season == YEAR) & (sch.game_type == "REG")].copy()
              CODE_FIX = {"STL": "LA", "SD": "LAC", "OAK": "LV", "LAR": "LA", "WSH": "WAS", "JAC": "JAX"}
              sch["home_team"] = sch["home_team"].replace(CODE_FIX)
              sch["away_team"] = sch["away_team"].replace(CODE_FIX)
              sch = sch[sch.home_team.isin(DIVISIONS_TEAMS) & sch.away_team.isin(DIVISIONS_TEAMS)]
              if sch.empty:
                  raise RuntimeError("no schedule found for " + str(YEAR))

              done = sch[sch.home_score.notna() & sch.away_score.notna()]
              todo = sch[sch.home_score.isna() | sch.away_score.isna()]
              wins0 = {}
              for _, g in done.iterrows():
                  hw = 1.0 if g.home_score > g.away_score else (0.5 if g.home_score == g.away_score else 0.0)
                  wins0[g.home_team] = wins0.get(g.home_team, 0.0) + hw
                  wins0[g.away_team] = wins0.get(g.away_team, 0.0) + (1.0 - hw)
              remaining = list(zip(todo.home_team, todo.away_team))

              # last completed week = largest week such that every game in weeks <= that week is final
              n_complete = 0
              for wk in sorted(sch.week.unique()):
                  part_ = sch[sch.week == wk]
                  if part_.home_score.notna().all() and part_.away_score.notna().all():
                      n_complete = int(wk)
                  else:
                      break
              total_weeks = int(sch.week.max())
              k_left = max(total_weeks - n_complete, 1)
              coefs = PROJ_COEFS[str(min(k_left, max(int(x) for x in PROJ_COEFS)))]

              prior_ups = {}
              prev = all_seasons.get(str(YEAR - 1))
              if prev:
                  for t_, v_ in prev["data"].items():
                      if v_["ups_score"] and v_["ups_score"][-1] is not None:
                          prior_ups[t_] = v_["ups_score"][-1]

              lg = pd.concat([
                  allg.assign(team=allg["home"], opp=allg["away"], ups=allg["home_pts"], home=1)[["week", "team", "opp", "ups", "home"]],
                  allg.assign(team=allg["away"], opp=allg["home"], ups=allg["away_pts"], home=0)[["week", "team", "opp", "ups", "home"]],
              ], ignore_index=True)
              ratings = predict_ratings(lg, prior_ups, coefs, PROJ_HFA)

              n_wc = 3 if YEAR >= 2020 else 2
              p_div, p_fin = simulate(ratings, wins0, remaining, n_wc, PROJ_B, PROJ_HFA,
                                      n_sims=N_SIMS, seed=YEAR * 100 + n_complete)

              proj = {
                  "season": YEAR,
                  "asOf": datetime.datetime.utcnow().strftime("%Y-%m-%d"),
                  "through_week": n_complete,
                  "games_remaining": len(remaining),
                  "n_sims": N_SIMS,
                  "regular_season_complete": len(remaining) == 0,
                  "division": {
                      d: sorted([{"team": t, "p": round(p_div[t], 4)} for t in ts], key=lambda x: -x["p"])
                      for d, ts in DIVISIONS.items()
                  },
                  "conference": {
                      c: sorted([{"team": t, "p": round(p_fin[t], 4)}
                                 for d, ts in DIVISIONS.items() if d.startswith(c) for t in ts], key=lambda x: -x["p"])
                      for c in ("AFC", "NFC")
                  },
              }
              with open("projections.json", "w", encoding="utf-8") as f:
                  json.dump(proj, f)
              print(f"Wrote projections.json (through week {n_complete}, {len(remaining)} games remaining).")
          except Exception as e:
              print("Projection step skipped:", repr(e))

          # ---- Upcoming-week matchups (independent of the projection step) ----
          try:
              import datetime as _dtm
              import io as _io, urllib.request as _ur
              import pandas as _pd
              _u = "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
              _s = _pd.read_csv(_io.StringIO(_ur.urlopen(_u, timeout=60).read().decode("utf-8")))
              _s = _s[(_s.season == int(YEAR)) & (_s.game_type == "REG")].copy()
              _fix = {"STL": "LA", "SD": "LAC", "OAK": "LV", "LAR": "LA", "WSH": "WAS", "JAC": "JAX"}
              _s["home_team"] = _s["home_team"].replace(_fix)
              _s["away_team"] = _s["away_team"].replace(_fix)
              if _s.empty:
                  raise RuntimeError("no schedule found for " + str(YEAR))
              _all = sorted(set(_s.home_team) | set(_s.away_team))
              _open = _s[_s.home_score.isna() | _s.away_score.isna()]
              _games, _byes, _wk = [], [], None
              if not _open.empty:
                  _wk = int(_open.week.min())
                  _w = _s[_s.week == _wk].sort_values(["gameday", "gametime"])
                  for _, _g in _w.iterrows():
                      _games.append({
                          "away": _g.away_team, "home": _g.home_team,
                          "gameday": str(_g.gameday), "gametime": None if _pd.isna(_g.gametime) else str(_g.gametime),
                          "spread": None if _pd.isna(_g.spread_line) else float(_g.spread_line),
                      })
                  _byes = sorted(set(_all) - set(_w.home_team) - set(_w.away_team))
              with open("matchups.json", "w", encoding="utf-8") as f:
                  json.dump({"season": int(YEAR), "week": _wk, "games": _games, "byes": _byes,
                             "asOf": _dtm.datetime.utcnow().strftime("%Y-%m-%d")}, f)
              print(f"Wrote matchups.json (week {_wk}, {len(_games)} games).")
          except Exception as e:
              print("Matchups step skipped:", repr(e))
          PYEOF

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -f projections.json ]; then git add projections.json; fi
          if [ -f matchups.json ]; then git add matchups.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ steps.season.outputs.season }} season data"
            git push
          fi
